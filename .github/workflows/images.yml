# Builds the production images on GitHub's runners and pushes them to GHCR.
# The VPS is too small to run `next build` next to its other services in
# reasonable time, so it only pulls these (deploy/deploy-pull.sh).
name: Images

on:
  push:
    branches: [main, security-audit-fixes]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  # NEXT_PUBLIC_* are inlined into the client bundle, so they are build inputs.
  # Repository variables override the defaults without editing this file.
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'http://149.56.99.247:8090' }}
  NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL || 'hello@billanta.com' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: frontend
            dockerfile: apps/frontend/Dockerfile
            target: runtime
          - name: backend
            dockerfile: apps/backend/Dockerfile
            target: runtime
          - name: migrate
            dockerfile: apps/backend/Dockerfile
            target: migrate
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_CONTACT_EMAIL=${{ env.NEXT_PUBLIC_CONTACT_EMAIL }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.REGISTRY }}/billanta-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/billanta-${{ matrix.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
